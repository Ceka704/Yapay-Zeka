// ===== Metin işleme =====
function sadelestir(t) {
  return t.toLocaleLowerCase("tr").replace(/['’`´]/g, "")
    .replace(/ç/g, "c").replace(/ğ/g, "g").replace(/ı/g, "i").replace(/ö/g, "o").replace(/ş/g, "s").replace(/ü/g, "u")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
const DOLGU = new Set(("ve ile de da ki bir bu su o mi mu midir mudur ne nedir nasil kim hakkinda bilgi bilgiler ver verir misin musun bana anlat soyle acikla hangi neden niye icin ama veya gibi cok daha lutfen acaba ya yani").split(" "));
const ESANLAMLI = [
  ["merhaba", "selam", "selamlar", "slm", "mrb", "gunaydin"],
  ["nasilsin", "naber", "nasilsiniz"],
  ["adin", "ismin", "isim", "ad"],
  ["tesekkur", "tesekkurler", "sagol", "eyvallah", "sag"],
  ["gorusuruz", "hoscakal", "bye"],
  ["yarattı", "yapti", "gelistirdi", "yazdi", "yaratti", "yapan"],
  ["saka", "fikra", "espri"]
];
const kok = w => w.length > 5 ? w.slice(0, 5) : w;
const SYN = {};
ESANLAMLI.forEach(g => g.forEach(w => { SYN[kok(sadelestir(w))] = kok(sadelestir(g[0])); }));
function tokenle(t) {
  const l = sadelestir(t).split(" ").filter(w => w && !DOLGU.has(w)).map(w => { const k = kok(w); return SYN[k] || k; });
  return [...new Set(l)];
}
function uzaklik(a, b) {
  let o = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const s = [i];
    for (let j = 1; j <= b.length; j++) s[j] = Math.min(o[j] + 1, s[j - 1] + 1, o[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    o = s;
  }
  return o[b.length];
}
function kelimeBenzerligi(a, b) {
  if (a === b) return 1;
  if (a.length < 4 || b.length < 4) return 0;
  const s = 1 - uzaklik(a, b) / Math.max(a.length, b.length);
  return s >= 0.75 ? s : 0;
}
function ucluler(t) { const p = "  " + t + " ", s = new Set(); for (let i = 0; i < p.length - 2; i++) s.add(p.slice(i, i + 3)); return s; }
function ucluBenzerlik(a, b) {
  const A = ucluler(a), B = ucluler(b); let o = 0; A.forEach(x => { if (B.has(x)) o++; });
  return (2 * o) / (A.size + B.size);
}
function skorla(q, k, idf) {
  const kapsam = (x, y) => {
    let top = 0, ok = 0;
    for (const w of x) { const a = idf(w); top += a; let en = 0; for (const v of y) en = Math.max(en, kelimeBenzerligi(w, v)); ok += a * en; }
    return top ? ok / top : 0;
  };
  const p = kapsam(q, k), r = kapsam(k, q);
  let kelime = (p + r) ? (2 * p * r) / (p + r) : 0;
  if (Math.min(p, r) < 0.4) kelime *= 0.7;
  return 0.85 * kelime + 0.15 * ucluBenzerlik(q.join(" "), k.join(" "));
}
function enIyiEslesme(soru) {
  const q = tokenle(soru);
  if (!q.length) return { key: null, skor: 0, varyant: "" };
  const kayitlar = [], df = {}; let N = 0;
  for (const key in bilgi) {
    const vars = key.split("|").map(v => ({ ham: v, tok: tokenle(v) })).filter(v => v.tok.length);
    vars.forEach(v => { N++; v.tok.forEach(w => { df[w] = (df[w] || 0) + 1; }); });
    kayitlar.push({ key, vars });
  }
  const idf = w => Math.log(1 + (N + 1) / ((df[w] || 0) + 1));
  let en = { key: null, skor: 0, varyant: "" };
  for (const k of kayitlar) for (const v of k.vars) {
    const s = skorla(q, v.tok, idf);
    if (s > en.skor) en = { key: k.key, skor: s, varyant: v.ham };
  }
  return en;
}

// ===== Akıllı özel yetenekler =====
function hesapla(ham) {
  let t = ham.toLocaleLowerCase("tr").replace(/kaç eder|kac eder|hesapla|=|\?/g, " ")
    .replace(/(\d)\s*[x×]\s*(\d)/g, "$1*$2").replace(/÷/g, "/").replace(/\^/g, "**")
    .replace(/\bartı\b/g, "+").replace(/\beksi\b/g, "-").replace(/\bçarpı\b/g, "*").replace(/\bbölü\b/g, "/")
    .replace(/(\d),(\d)/g, "$1.$2").trim();
  if (!/\d/.test(t) || !/[+\-*/%]/.test(t) || !/^[\d+\-*/().%\s]+$/.test(t.replace(/\*\*/g, "*"))) return null;
  try {
    const s = Function('"use strict";return (' + t + ")")();
    if (typeof s !== "number" || !isFinite(s)) return "Bu işlemin sonucu tanımsız.";
    return "Sonuç: " + (Math.round(s * 1e8) / 1e8).toLocaleString("tr");
  } catch (e) { return null; }
}

function ozelCevap(ham) {
  const s = sadelestir(ham), simdi = new Date();
  const h = hesapla(ham); if (h) return h;

  let m = s.match(/^(?:benim )?(?:adim|ismim) (\p{L}[\p{L} ]{0,20})$/u) || s.match(/^ben (\p{L}{2,20})$/u);
  if (m && !/^(iyi|kotu|yorgun|aciktim|bot|senin|mutlu|uzgun|hasta|harika|super)/.test(m[1]) && !/(yim|yum|dim|dum|tim|tum)$/.test(m[1])) {
    const ad = ham.trim().split(/\s+/).pop().replace(/[^\p{L}]/gu, "");
    kullanici.ad = ad.charAt(0).toLocaleUpperCase("tr") + ad.slice(1).toLocaleLowerCase("tr"); kaydet();
    return "Memnun oldum " + kullanici.ad + "!";
  }
  if (/\b(adim|ismim)\b/.test(s) && /\b(ne|biliyor|hatirla)/.test(s))
    return kullanici.ad ? "Adın " + kullanici.ad + "." : "Henüz adını bilmiyorum. “Adım ...” diye yazarsan öğrenirim.";

  if (/yazi tura/.test(s)) return sec(["Yazı!", "Tura!"]);
  if (/\bzar at/.test(s)) return "Zar: " + (1 + Math.floor(Math.random() * 6));
  if (/saat kac|saat kaç|\bsaat\b.*\b(simdi|ne)\b/.test(s)) return "Saat " + simdi.toLocaleTimeString("tr", { hour: "2-digit", minute: "2-digit" });
  if (/gunlerden ne|hangi gun|hangi tarih|tarih (ne|kac)|bugunun tarihi|ayin kaci|bugun kacinda/.test(s))
    return "Bugün " + simdi.toLocaleDateString("tr", { day: "numeric", month: "long", year: "numeric", weekday: "long" });
  return null;
}

// ===== Sohbet =====
let oneri = null;
const EVET = new Set(["evet", "evt", "he", "aynen", "tamam", "evet o", "dogru"]);
const sec = c => Array.isArray(c) ? c[Math.floor(Math.random() * c.length)] : c;

function yaz(metin, kim) {
  const d = document.createElement("div");
  d.className = "msg " + kim; d.textContent = metin;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
function botCevap(metin) {
  const d = yaz("Yazıyor…", "bot yaziyor");
  setTimeout(() => { d.className = "msg bot"; d.textContent = metin; chat.scrollTop = chat.scrollHeight; }, 300 + Math.min(metin.length * 8, 600));
}
function yanitUret(ham) {
  const s = sadelestir(ham);
  if (oneri && EVET.has(s)) { const c = sec(bilgi[oneri]); oneri = null; return c; }
  oneri = null;
  const ozel = ozelCevap(ham);
  if (ozel) return ozel;
  const e = enIyiEslesme(ham);
  if (e.key && e.skor >= ESIK) {
    let c = sec(bilgi[e.key]);
    if (kullanici.ad && /^(merhaba|selam)/.test(sadelestir(e.varyant))) c = c.replace("!", ", " + kullanici.ad + "!");
    return c;
  }
  if (e.key && e.skor >= ONERI_ESIK) { oneri = e.key; return "Tam anlayamadım. Şunu mu demek istedin: “" + e.varyant + "”? (evet / hayır)"; }
  return sec(["Bunu henüz bilmiyorum. Başka türlü sorabilir misin?", "Bu konuda bilgim yok, ama başka bir şey sorabilirsin.", "Anlayamadım. “Ne yapabilirsin” diye sorarak neler bildiğimi görebilirsin."]);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const ham = girdi.value.trim();
  if (!ham) return;
  girdi.value = ""; yaz(ham, "me");
  botCevap(yanitUret(ham));
});

</script>
